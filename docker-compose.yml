version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: habits_user
      POSTGRES_PASSWORD: habits_password
      POSTGRES_DB: habits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://habits_user:habits_password@db:5432/habits_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
    driver: local