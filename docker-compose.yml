version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: habits_user
      POSTGRES_PASSWORD: habits_password
      POSTGRES_DB: habits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://habits_user:habits_password@db:5432/habits_db
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local